name: build-images

# Build both images and push them to GHCR on every commit to main.
# Multi-arch (amd64 + arm64) so any Synology pulls the right one — no NAS build needed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bridge
            context: ./bridge
            image: ghcr.io/${{ github.repository_owner }}/claude-nas-bridge
          - name: terminal
            context: ./ttyd
            image: ghcr.io/${{ github.repository_owner }}/claude-nas-terminal
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3       # enables arm64 build on the amd64 runner
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
